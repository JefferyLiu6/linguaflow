name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    name: Lint · Type-check · Test · Build · E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/ci
          JWT_SECRET: ci-secret-not-used-in-production

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end test (guest mode)
        run: pnpm test:e2e
        # E2E_AUTH_EMAIL / E2E_AUTH_PASSWORD are NOT set in CI by default.
        # The authenticated-flow spec skips itself when those vars are absent.

  python:
    name: Python agent tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: agent/requirements.txt

      - name: Install agent dependencies
        run: pip install -r agent/requirements.txt

      - name: Validate shared data bundle
        working-directory: agent
        run: python -m retrieval.validate_corpus --output runs/data-validation.json

      - name: Run agent test suite
        working-directory: agent
        run: python -m pytest tests/ -q --tb=short
        # Tests mock all external services (LLM, DB, Langfuse) and run offline.
        # No OPENAI_API_KEY, DATABASE_URL, or LANGFUSE_* keys are needed.

      - name: Retrieval regression benchmark (offline)
        working-directory: agent
        run: python -m retrieval.benchmark --output runs/ci-retrieval.json

      - name: Question-aware lexical diagnostic (offline)
        working-directory: agent
        run: python -m retrieval.lexical_benchmark --output runs/lexical-evidence.json --review-output runs/relevance-review.json

      - name: Provider comparison preflight (offline)
        working-directory: agent
        run: python -m retrieval.retrieval_comparison plan --output runs/retrieval-comparison-plan.json

      - name: Three-layer answer evaluation replay (offline)
        working-directory: agent
        run: |
          python ../scripts/replay_frozen_answer.py runs/ci-answer-eval.json
          python ../scripts/compare_eval_reports.py runs/answer-pilot-v3-results.json runs/ci-answer-eval.json
        # Replays saved public synthetic answers/judgments; no provider or DB calls.

      - name: Preserve retrieval evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retrieval-benchmark
          path: |
            agent/runs/ci-retrieval.json
            agent/runs/data-validation.json
            agent/runs/lexical-evidence.json
            agent/runs/relevance-review.json
            agent/runs/retrieval-comparison-plan.json
            agent/runs/ci-answer-eval.json
          if-no-files-found: warn

  retrieval-integration:
    name: Disposable pgvector publication tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r agent/requirements.txt
      - name: Verify full suite with real PostgreSQL
        run: python scripts/check_retrieval_index.py --all
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-integration
          path: |
            agent/runs/index-integration.xml
            agent/runs/index-integration.json
